[project]
name = "medpal"
version = "0.1.0"
description = "MedPal: triage + booking, records Q&A and consultation scribe on LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "en-core-web-lg",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.1.0",
    "pgvector>=0.5.1",
    "presidio-analyzer>=2.2.366",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.20",
    "redis>=5.3.1",
    "sqlalchemy>=2",
    "tenacity>=8.2.3,<9.2.0",
    "uvicorn[standard]>=0.54.0",
    "boto3>=1.43.123",
    "pypdf>=6.21.4",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.2.1",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]  # markdown code samples are illustrative, not formatted code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"infra/migrations/**" = ["E501", "S608"]  # DDL built from module constants, not user input
"data/synthetic/**" = ["S311"]  # seeded random for reproducible synthetic data, not cryptography
"infra/scripts/load_test.py" = ["S311"]  # random traffic mix and arrival times, not security

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "data/transforms/tests", "data/synthetic/tests"]
markers = [
  "integration: needs the docker-compose stack (Postgres, Redis); skipped when unavailable",
]

# Module boundaries (ADR-0001): only services.platform.egress may talk to vendors,
# and workflow modules don't reach into each other.
[tool.importlinter]
root_packages = ["services"]

[[tool.importlinter.contracts]]
name = "Workflow modules are independent"
type = "independence"
modules = ["services.scheduling", "services.records", "services.scribe", "services.pharmacy", "services.notifications"]

[[tool.importlinter.contracts]]
name = "Platform does not depend on workflows or the agent"
type = "forbidden"
source_modules = ["services.platform"]
forbidden_modules = ["services.agent", "services.api", "services.scheduling", "services.records", "services.scribe", "services.pharmacy"]

[dependency-groups]
data = [
    "liac-arff>=2.5.0",
    "pandas>=3.1.0",
]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
