# Local stack. `make up` starts the data services; `make up-all` adds the API container.
# Local record objects persist in a named volume; deployment can select private S3.
name: medpal

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: medpal
      POSTGRES_PASSWORD: medpal   # local dev only; never reused outside docker
      POSTGRES_DB: medpal
    ports: ["5433:5432"]          # 5433 avoids clashing with a host Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # creates the non-superuser app role
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medpal -d medpal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    profiles: ["app"]
    environment:
      MEDPAL_ENV: dev
      MEDPAL_DATABASE_URL: postgresql://medpal_app:medpal_app@postgres:5432/medpal          # app: RLS applies
      MEDPAL_MIGRATION_DATABASE_URL: postgresql://medpal:medpal@postgres:5432/medpal      # owner: migrations only
      MEDPAL_OBJECT_STORE_DIRECTORY: /app/objects
      MEDPAL_INGEST_MODE: queue
      MEDPAL_REDIS_URL: redis://redis:6379
      PORT: 8000
    volumes:
      - objects:/app/objects
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head && uvicorn services.api.main:app --host 0.0.0.0 --port $${PORT:-8000}"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    profiles: ["app"]
    environment:
      MEDPAL_ENV: dev
      MEDPAL_DATABASE_URL: postgresql://medpal_app:medpal_app@postgres:5432/medpal
      MEDPAL_OBJECT_STORE_DIRECTORY: /app/objects
      MEDPAL_REDIS_URL: redis://redis:6379
      MEDPAL_INGEST_MAX_CONCURRENCY: "4"
    volumes:
      - objects:/app/objects
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["arq", "services.worker.WorkerSettings"]

volumes:
  pgdata:
  objects:
