# Ingress: the only way in. Sits on the public network and the boundary network.
server {
    listen 8000;
    client_max_body_size 16m;          # records upload and consultation audio limits are enforced by the API too
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;           # streamable HTTP (MCP) and long answers
        proxy_read_timeout 120s;
    }
}
